<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
</head>
<body>
    <article class="login">
        <h1 class="login-titulo">Bienvenido de nuevo</h1>
        <form class="login-formulario" action = "loginContraseña.html" method="post">
            <div class="login-campo">
                <label for="email">Correo Electronico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" class="login-boton">Siguiente</button>

            <label class="enlace">¿No tenés una cuenta? <a href="signup.html">Registrate</a></label>
        </form>
    </article>
</body>
</html>
