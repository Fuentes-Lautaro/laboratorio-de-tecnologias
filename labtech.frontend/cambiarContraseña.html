<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/footer.css">
</head>
<body>
    <header>
        <div class="panelSuperior">
            <div class="logo">
                <a href="index.html"><img src="imagenes/logo-Maria-Balbina-Lateral.png" alt="Logo María Balbina"></a>
            </div>
        </div>
    </header>
    <article class="login">
        <h1 class="login-titulo">Cambiar Contraseña</h1>
        <form class="login-formulario" action="login.html" method="post">
            <div class="login-campo">
                <label for="contraseña">Nueva Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" required>
            </div>

            <div class="login-campo">
                <label for="confirmar-contraseña">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirmar-contraseña" name="confirmar-contraseña" required>
            </div>

            <button type="submit" class="login-boton">Confirmar</button>
        </form>
    </article>
</body>
