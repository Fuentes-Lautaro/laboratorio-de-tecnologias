<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/footer.css">
</head>
<body>
    <header>
        <div class="panelSuperior">

            <div class="logo">
              <a href="index.html"><img src="imagenes/logo-Maria-Balbina-Lateral.png" alt="Logo María Balbina"></a>  
            </div>
            
        </div>

    </header>
    <main>
    <article class="login">
        <h1 class="login-titulo">Crear Cuenta</h1>
        <form class="login-formulario" action="mailto:">
            <div class="login-campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="login-campo">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>

            <div class="login-campo">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <div class="login-campo">
                <label for="direccion">Dirección <span>(opcional)</span></label>
                <input type="text" id="direccion" name="direccion">
            </div>

            <div class="login-campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="login-campo">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <div class="login-campo">
                <label for="comoNosConocio">¿Cómo conociste nuestra página?</label>
                <select id="comoNosConocio" name="comoNosConocio">
                    <option value="redes">Redes sociales</option>
                    <option value="amigos">Recomendación de un amigo</option>
                    <option value="buscador">Buscador de internet</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="login-campo">
                <label for="comentarios">Comentarios adicionales</label>
                <textarea id="comentarios" name="comentarios" rows="5" placeholder="Escribí algún comentario si querés..."></textarea>
            </div>

            <button type="submit" class="login-boton">Registrarse</button>
        </form>
    </article>
    </main>
</body>
<footer>

    <div class="footer-contenedor">

        
        <div class="footer-seccion">
            <h3>MARIA BALBINA</h3>
            <p>
                Mas que un vino, una experiencia.
            </p>
        </div>

        <div class="footer-seccion">

        </div>

        <div class="footer-seccion">

            <p>📧 contacto@mariab.com</p>
            <p>📱 +54 9 266 4 1234 56 </p>
        </div>

        <div class="footer-seccion">
            <h3>Seguinos</h3>
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">TikTok</a>
        </div>

    </div>

    <div class="footer-copy">

    </div>

</footer>
</html>
